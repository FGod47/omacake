# Omarchy Quattro surfaces for Omacake.
# Ink-black surfaces, soft pastel controls, solid mauve selection,
# and a smooth vibrant border preserve Omacake's aesthetic.

[bar]
background = "#05080A"
background-alpha = 1.0
text = "#FFF6FF"
active = "#DFBAFF"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "rgba(dfbaffee) rgba(ff9fbcee) rgba(b2fff3ee) 45deg"
active-border-foreground = "#DFBAFF"

[controls]
normal-color = "#A29DA2"
normal-fill-alpha = 0.05
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color = "#DFBAFF"
hover-cursor-fill-alpha = 0.12
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.52

focus-color = "#DFBAFF"
focus-fill-alpha = 0.14
focus-border-width = 1
focus-border-alpha = 0.84

selected-color = "#DFBAFF"
selected-fill-alpha = 0.20
selected-border-width = 1
selected-border-alpha = 0.48

pressed-color = "#FF9FBC"
pressed-fill-alpha = 0.24
selection-color = "#DFBAFF"
selection-fill-alpha = 0.38

[spacing]
scale = 1.0
scale-with-font = true
xs = 2
md = 4
control-padding-y = 5
panel-padding = 10

[font]
base-size = 12
heading = 16
icon-large = 18

[popups]
background = "#05080A"
background-alpha = 1.0
text = "#FFF6FF"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 1

[tooltip]
background = "#05080A"
background-alpha = 0.98
text = "#FFF6FF"
border = "#141719"
border-alpha = 1.0
border-width = 1

[notifications]
background = "#05080A"
background-alpha = 1.0
text = "#FFF6FF"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 1
countdown = "#DFBAFF"

[launcher]
background = "#05080A"
background-alpha = 1.0
text = "#FFF6FF"
border = "transparent"
border-alpha = 0.0
border-width = 0
scrim = "#05080A"
scrim-alpha = 0.0
selected-background = "#FFE1E1"
selected-background-alpha = 1.0
selected-text = "#05080A"
selected-border = "#DFBAFF"
selected-border-alpha = 0.0
selected-border-width = 0

[menu]
logo = "omacake"
background = "#05080A"
background-alpha = 1.0
text = "#A29DA2"
border = "transparent"
border-alpha = 0.0
border-width = 0
scrim = "#05080A"
scrim-alpha = 0.0
search-background = "#16161E"
search-text = "#FFF6FF"
selected-background = "#DFBAFF"
selected-background-alpha = 1.0
selected-text = "#05080A"
selected-border = "#DFBAFF"
selected-border-alpha = 0.0
selected-border-width = 0

[polkit]
background = "#05080A"
background-alpha = 1.0
text = "#FFF6FF"
text-error = "#FF9FBC"
border = "hyprland.active-border"
border-error = "#FF9FBC"
border-alpha = 1.0
border-width = 1
scrim = "#05080A"
scrim-alpha = 0.50
accent = "#DFBAFF"

[lock]
background = "#05080A"
background-alpha = 1.0
text = "#FFF6FF"
placeholder = "#DCE2F7B3"
text-error = "#FF9FBC"
border = "hyprland.active-border"
border-active = "hyprland.active-border"
border-error = "#FF9FBC"
border-alpha = 1.0
border-width = 1
selection = "#DFBAFF"
selection-alpha = 0.45

[image-picker]
scrim = "#05080A"
scrim-alpha = 0.50
text = "#FFF6FF"
selected-border = "#DFBAFF"
selected-border-alpha = 1.0
unselected-border = "#141719"
unselected-border-alpha = 1.0
